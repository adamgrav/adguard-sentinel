version: 2

# Conservative on purpose. This is a small project maintained by one person, and
# every update has to pass both CI jobs and a dependency-policy review before it
# can land, so a weekly flood of pull requests would be noise rather than
# safety. Security updates arrive separately through Dependabot alerts, which are
# not rate-limited by this schedule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      # rusqlite ships alone so a storage-layer rollback is one version rather
      # than a bundle. A regression there is silent and cumulative — state,
      # retention, or permissions degrading over days without an error — where a
      # parser or hashing bump fails loudly on the next run. It also needs the
      # isolated alert and recovery exercise in docs/DEPLOYMENT.md re-run, which
      # is not worth dragging unrelated updates through.
      cargo-storage:
        patterns:
          - "rusqlite"
      # Everything else in one pull request. Reviewing a single lockfile change
      # against docs/DEPENDENCIES.md is more useful than reviewing ten.
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "rusqlite"
